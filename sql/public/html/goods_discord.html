<script>
    // Загружаем футер из отдельного файла
    fetch('footer.html')
        .then(response => response.text())
        .then(html => {
            document.getElementById('footer-container').innerHTML = html;

</script>
<script>
   const cart = [];
    const goodsList = document.getElementById('goods-list');
    const cartModal = document.getElementById('cartModal');
    const cartItems = document.querySelector('.cart-items');
    const cartTotal = document.querySelector('.cart-total');

    // Проверяем авторизацию пользователя
    fetch('/check-session')
        .then(response => response.json())
        .then(data => {
            const accountLink = document.getElementById('accountLink');
            if (data.isLoggedIn) {
                if (data.userType === 'admin') {
                    accountLink.href = '../html/adminLK.html'; // Admin dashboard
                } else {
                    accountLink.href = '../html/lk.html'; // User dashboard
                }
            } else {
                accountLink.href = '../html/log.html'; // Login page
            }
        })
        .catch(error => console.error('Ошибка проверки сессии:', error));
  // Подгрузка товаров из БД
  fetch('/products')
            .then(response => response.json())
            .then(products => {
                // Фильтруем товары по жанру "racing"
                const racingProducts = products.filter(product => product.genres.includes('racing'));
                racingProducts.forEach(product => {
                    const item = document.createElement('div');
                    item.className = 'goods-item';
                    item.innerHTML = `
                        <img src="${product.image_url}" alt="${product.name}">
                        <h3 class="goods-title">${product.name}</h3>
                        <p class="goods-price">${product.price}р</p>
                        <button class="btn btn-primary add-to-cart" data-id="${product.id}">Добавить в корзину</button>
                    `;
                    goodsList.appendChild(item);
                });

                document.querySelectorAll('.add-to-cart').forEach(button => {
                button.addEventListener('click', () => {
                    const productId = button.getAttribute('data-id');
                    const product = products.find(p => p.id == productId);
                    if (product) {
                        cart.push({
                            id: product.id,
                            name: product.name,
                            price: product.price 
                        });
                        console.log('Cart after adding item:', cart);
                        updateCart();
                    }
                });
            });
        });

        function updateCart() {
    cartItems.innerHTML = '';
    let total = 0;

    cart.forEach(item => {
        const itemElement = document.createElement('div');
        itemElement.textContent = `${item.name} - ${item.price}р`;
        cartItems.appendChild(itemElement);
        total += parseFloat(item.price); 
    });

    cartTotal.textContent = `Итого: ${total.toFixed(2)}р`; 
}

 
    document.getElementById('cartButton').addEventListener('click', () => {
        cartModal.style.display = 'block';
    });

    document.querySelector('.close-button').addEventListener('click', () => {
        cartModal.style.display = 'none';
    });

    document.querySelector('.clear-cart').addEventListener('click', () => {
        cart.length = 0;
        updateCart();
    });

    document.querySelector('.checkout').addEventListener('click', () => {
    if (cart.length === 0) {
        alert('Корзина пуста!');
        return;
    }

    console.log('Cart before checkout:', cart); 

    fetch('/checkout', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json'
        },
        body: JSON.stringify(cart) 
    })
    .then(response => {
        if (response.ok) {
            alert('Товары успешно приобретены!');
            cart.length = 0; 
            updateCart();
            cartModal.style.display = 'none'; 
        } else {
            return response.text().then(text => {
                alert('Ошибка при оформлении заказа: ' + text); 
            });
        }
    })
    .catch(error => {
        console.error('Error during checkout:', error);
        alert('Ошибка при оформлении заказа.');
    });
});
</script>
