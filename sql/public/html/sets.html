<script>
    const goodsList = document.getElementById('goods-list');
    const cartModal = document.getElementById('cartModal');
    const cartItems = document.querySelector('.cart-items');
    const cartTotal = document.querySelector('.cart-total');
    const searchInput = document.getElementById('searchInput');
    let cart = JSON.parse(localStorage.getItem('cart')) || [];
    // Проверяем авторизацию пользователя
    fetch('/check-session')
        .then(response => response.json())
        .then(data => {
            const accountLink = document.getElementById('accountLink');
            if (data.isLoggedIn) {
                if (data.userType === 'admin') {
                    accountLink.href = '../html/adminLK.html'; // Admin dashboard
                } else {
                    accountLink.href = '../html/lk.html'; // User dashboard
                }
            } else {
                accountLink.href = '../html/log.html'; // Login page
            }
        })
        .catch(error => console.error('Ошибка проверки сессии:', error));

let allProducts = []; // Глобальная переменная для хранения всех товаров

// Подгрузка товаров из бд
fetch('/products')
    .then(response => response.json())
    .then(products => {
        allProducts = products;
        applyFilters();
    });

// Функции сортировки и фильтрации
function applyFilters() {
    const searchQuery = searchInput.value.toLowerCase();
    const sortValue = document.getElementById('sortSelect').value;
    const genreFilter = document.getElementById('genreFilter').value;
    const priceRange = document.getElementById('priceRange').value;
    
    let filteredProducts = [...allProducts];
    
    // Применяем поиск по названию
    if (searchQuery) {
        filteredProducts = filteredProducts.filter(product => 
            product.name.toLowerCase().includes(searchQuery))
    }
    
    // Применяем фильтр по жанру
    if (genreFilter !== 'all') {
        filteredProducts = filteredProducts.filter(product => 
            product.genre === genreFilter)
    }
    
    // Применяем фильтр по цене
    if (priceRange !== 'all') {
        const [min, max] = priceRange.split('-').map(Number);
        if (priceRange.endsWith('+')) {
            filteredProducts = filteredProducts.filter(product => 
                product.price >= min)
        } else {
            filteredProducts = filteredProducts.filter(product => 
                product.price >= min && (isNaN(max) || product.price <= max))
        }
    }
    
    // Применяем сортировку
    filteredProducts = sortProducts(filteredProducts, sortValue);
    
    displayProducts(filteredProducts);
}

function sortProducts(products, sortValue) {
    const [key, direction] = sortValue.split('-');
    
    return [...products].sort((a, b) => {
        let valueA, valueB;
        
        if (key === 'name') {
            valueA = a.name.toLowerCase();
            valueB = b.name.toLowerCase();
            return direction === 'asc' 
                ? valueA.localeCompare(valueB) 
                : valueB.localeCompare(valueA);
        } else if (key === 'price') {
            valueA = a.price;
            valueB = b.price;
            return direction === 'asc' 
                ? valueA - valueB 
                : valueB - valueA;
        }
        return 0;
    });
}

// Обработчики событий для фильтров
document.getElementById('sortSelect').addEventListener('change', applyFilters);
document.getElementById('genreFilter').addEventListener('change', applyFilters);
document.getElementById('priceRange').addEventListener('change', applyFilters);
document.getElementById('resetFilters').addEventListener('click', resetFilters);
searchInput.addEventListener('input', applyFilters);

function resetFilters() {
    document.getElementById('sortSelect').value = 'name-asc';
    document.getElementById('genreFilter').value = 'all';
    document.getElementById('priceRange').value = 'all';
    searchInput.value = '';
    applyFilters();
}

//  функция displayProducts
function displayProducts(products) {
    goodsList.innerHTML = '';
    
    if (products.length === 0) {
        goodsList.innerHTML = '<p class="no-results">Товары не найдены. Попробуйте изменить параметры поиска.</p>';
        return;
    }
    
    products.forEach(product => {
        const item = document.createElement('div');
        item.className = 'goods-item';
        item.innerHTML = `
            <img src="${product.image_url}" alt="${product.name}" class="product-image">
            <h3 class="goods-title">${product.name}</h3>
            <p class="goods-genre">${product.genre}</p>
            <p class="goods-price">${product.price}р</p>
            <button class="btn btn-primary add-to-cart" data-id="${product.id}">Добавить в корзину</button>
        `;
        goodsList.appendChild(item);
        
        // Обработчик клика на товар
        item.addEventListener('click', (e) => {
            if (!e.target.classList.contains('add-to-cart')) {
                window.location.href = `product.html?id=${product.id}`;
            }
        });
    });
    
    // Обработчики для кнопок "Добавить в корзину"
    document.querySelectorAll('.add-to-cart').forEach(button => {
        button.addEventListener('click', (e) => {
            e.stopPropagation();
            const productId = button.getAttribute('data-id');
            const product = allProducts.find(p => p.id == productId);
            if (product) {
                addToCart({
                    id: product.id,
                    name: product.name,
                    price: product.price,
                    image: product.image_url,
                    genre: product.genre
                });
            }
        });
    });
}

function addToCart(product) {
    const existingItem = cart.find(item => item.id === product.id);
    
    if (!existingItem) {
        // Сохраняем все необходимые данные, включая image_url
        cart.push({
            id: product.id,
            name: product.name,
            price: product.price,
            image: product.image_url, // Используем image_url из БД
            image_url: product.image_url, // Дублируем для совместимости
            discount: product.discount || 0
        });
        localStorage.setItem('cart', JSON.stringify(cart));
        showCartNotification();
    } else {
        showCartNotification('Товар уже в корзине');
    }
}

function showCartNotification(message = 'Товар добавлен в корзину') {
    const notification = document.createElement('div');
    notification.className = 'cart-notification';
    notification.textContent = message;
    document.body.appendChild(notification);
    
    setTimeout(() => {
        notification.classList.add('fade-out');
        setTimeout(() => notification.remove(), 500);
    }, 2000);
}
