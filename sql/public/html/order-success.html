<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Заказ оформлен - GameStore</title>
    <link rel="stylesheet" href="../css/reboot.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/footer.css">
    <link rel="stylesheet" href="../css/order-success.css">
</head>
<body>
    <header id="header">
        <nav class="navbar">
            <div class="container">
                <div class="navbar-left">
                    <img src="../images/istockphoto-1249882585-170667a.jpg" alt="logo" width="90" height="50">
                    <a href="../html/index.html" class="navbar-brand">GameStore</a>
                </div>
                <div class="navbar-right">
                    <a href="../html/cart.html" id="cartButton" class="callback">Корзина</a>
                    <a href="#" id="accountLink" class="callback">Личный кабинет</a>
                </div>
            </div>
        </nav>
    </header>
    <div id="nav-container"></div>
    <main class="order-success-container">
        <div class="order-success-content">
            <div class="success-icon">✓</div>
            <h1>Заказ успешно оформлен!</h1>
            <p>Спасибо за ваш заказ. Информация о заказе отправлена на вашу почту.</p>
            <div class="order-actions">
                <a href="../html/sets.html" class="btn-continue-shopping">Продолжить покупки</a>
                <a href="../html/lk.html" class="btn-view-orders">Мои заказы</a>
            </div>
        </div>
    </main>

    <div id="footer-container"></div>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const urlParams = new URLSearchParams(window.location.search);
            const orderId = urlParams.get('orderId');
            
            if (orderId) {
                const orderIds = orderId.split(',');
                if (orderIds.length > 0) {
                    document.querySelector('.order-success-content p').innerHTML += 
                        `<br><strong>Номер заказа: ${orderIds[0]}</strong>`;
                }
            }
        });
        </script>
        <script>
            fetch('../html/nav.html')
                .then(response => response.text())
                .then(html => {
                    document.getElementById('nav-container').innerHTML = html;
                });
        </script>
    <script>
        
        fetch('../html/footer.html')
            .then(response => response.text())
            .then(html => {
                document.getElementById('footer-container').innerHTML = html;
            });
        
        // Проверяем авторизацию пользователя
        fetch('/check-session')
            .then(response => response.json())
            .then(data => {
                const accountLink = document.getElementById('accountLink');
                if (data.isLoggedIn) {
                    if (data.userType === 'admin') {
                        accountLink.href = '../html/adminLK.html';
                    } else {
                        accountLink.href = '../html/lk.html';
                    }
                } else {
                    accountLink.href = '../html/log.html';
                }
            });
    </script>
</body>
</html>
