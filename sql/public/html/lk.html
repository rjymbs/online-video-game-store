<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Личный кабинет</title>
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="../css/profile.css">
    <style>
        body {
            font-family: "Poppins", sans-serif;
            background: url('../images/nlo.jpg') no-repeat;
            background-size: cover;
            color: #fff;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: auto;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.3);
        }
        h1 {
            text-align: center;
            margin-bottom: 20px;
        }
        .section {
            margin-bottom: 30px;
            background: rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 5px;
        }
        .purchase-item {
            background: rgba(255, 255, 255, 0.1);
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 10px;
        }
        .btn {
            display: inline-block;
            padding: 10px 20px;
            background: #fff;
            color: #333;
            border-radius: 5px;
            text-decoration: none;
            transition: background 0.3s;
        }
        .btn:hover {
            background: #f0f0f0;
        }
        .modal-content {
            background: rgba(255, 255, 255, 0.9);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.3);
        }
    .user-info {
            background: rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .user-info p {
            margin: 5px 0;
        }
    </style>
</head>
<body>
    <!-- Модальное окно для отзыва -->
<div id="review-modal" style="display:none;">
    <div class="modal-content">
        <span id="close-modal">&times;</span>
        <h2>Оставьте свой отзыв</h2>
        <form id="review-form">
            <div>
                <label for="rating">Оценка (1.0 - 5.0):</label>
                <input type="number" id="rating" name="rating" min="1.0" max="5.0" step="0.1" required>
            </div>
            <div>
                <label for="comment">Комментарий:</label>
                <textarea id="comment" name="comment" required></textarea>
            </div>
            <div>
                <label>
                    <input type="checkbox" name="show_name"> Показывать имя в отзыве
                </label>
            </div>
            <button type="submit" class="btn">Отправить отзыв</button>
        </form>
    </div>
</div>
    <div class="container">
        <h1>Личный кабинет</h1>
         <!-- Информация о пользователе -->
         <div class="section user-info" id="user-info-section">
            <h2>Мой профиль</h2>
            <p><strong>ID:</strong> <span id="user-id"></span></p>
            <p><strong>Имя:</strong> <span id="user-name"></span></p>
            <p><strong>Email:</strong> <span id="user-email"></span></p>
            <p><strong>Дата регистрации:</strong> <span id="user-reg-date"></span></p>
        </div>
        <div class="section">
            <h2>Пополнение баланса</h2>
            <form id="recharge-form">
                <input type="number" name="amount" placeholder="Сумма пополнения" required>
                <button type="submit" class="btn">Пополнить</button>
            </form>
        </div>
        <div class="section">
            <h2>Баланс и бонусы</h2>
            <p>Баланс: <span id="user-balance">0</span> ₽</p>
            <p>Бонусы: <span id="user-bonus">0</span></p>
            <div>
                <h3>Статус пользователя: <span id="user-status">Бронза</span></h3>
                <h4>Процент бонусов: <span id="bonus-percentage">2%</span></h4>
            </div>
        </div>
        
        <div class="section">
            <h2>История покупок</h2>
            <div class="orders-list" id="orders-list"></div>
        </div>
<!-- 
        <div class="section">
            <h2>Редактирование данных</h2>
            <form id="update-form">
                <div class="input-box">
                    <input type="text" name="name" placeholder="Имя" required>
                </div>
                <div class="input-box">
                    <input type="email" name="email" placeholder="Электронная почта" required>
                </div>
                <div class="input-box">
                    <input type="password" name="password" placeholder="Новый пароль">
                </div>
                <button type="submit" class="btn">Сохранить изменения</button>
            </form>
        </div>

        <div class="section">
            <h2>Мои обращения</h2>
            <div id="complaints-list"></div>
        </div> -->
        <button id="logout-btn">Выйти из личного кабинета</button>
    </div>

    <script>
        
       document.addEventListener("DOMContentLoaded", function() {
        // Загрузка информации о пользователе
        fetch('/user/info')
                .then(response => {
                    if (response.ok) {
                        return response.json();
                    }
                    throw new Error('Failed to fetch user info');
                })
                .then(user => {
                    document.getElementById('user-id').textContent = user.id;
                    document.getElementById('user-name').textContent = user.name;
                    document.getElementById('user-email').textContent = user.email;
                    document.getElementById('user-reg-date').textContent = new Date(user.created_at).toLocaleDateString();
                })
                .catch(error => console.error('Error fetching user info:', error));
        fetch('/user/balance')
            .then(response => {
                if (response.ok) {
                    return response.json();
                }
                throw new Error('Failed to fetch user balance');
            })
            .then(data => {
                document.getElementById('user-balance').innerText = data.balance;
                document.getElementById('user-bonus').innerText = data.bonus_points;
            })
            .catch(error => console.error('Error fetching balance:', error));

            // Получаем статус пользователя
fetch('/user/status')
    .then(response => {
        if (response.ok) {
            return response.json();
        }
        throw new Error('Failed to fetch user status');
    })
    .then(data => {
        document.getElementById('user-status').innerText = data.status;
        document.getElementById('bonus-percentage').innerText = data.bonusPercentage + '%';
    })
    .catch(error => console.error('Error fetching status:', error));
        fetch('/orders')
    .then(response => response.json())
    .then(orders => {
        const ordersList = document.getElementById('orders-list');
        orders.forEach(order => {
            const item = document.createElement('div');
            item.className = 'purchase-item';
            item.innerHTML = `
                <strong>${order.name}</strong>
                <p>Цена: ${order.price}р</p>
                <p>Дата: ${new Date(order.order_date).toLocaleString()}</p>
                <a href="/download/${order.product_id}" class="btn">Скачать файл</a>
                <button class="btn review-btn" data-product-id="${order.product_id}">Заполнить отзыв</button>
            `;
            ordersList.appendChild(item);
        });
        
    

        // Добавляем обработчик событий для всех кнопок "Заполнить отзыв"
        document.querySelectorAll('.review-btn').forEach(button => {
            button.addEventListener('click', function() {
                const productId = this.getAttribute('data-product-id');
                openReviewModal(productId);
            });
        });
    })
    .catch(error => console.error('Error fetching orders:', error));

            document.getElementById('update-form').addEventListener('submit', function(event) {
                event.preventDefault();

                const formData = new FormData(event.target);
                const data = {};
                formData.forEach((value, key) => {
                    data[key] = value;
                });

                fetch('/update-user', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data)
                })
                .then(response => {
                    if (response.ok) {
                        alert('Данные обновлены');
                    } else {
                        alert('Ошибка обновления данных');
                    }
                })
                .catch(error => console.error('Error updating user:', error));
            });
            document.getElementById('logout-btn').addEventListener('click', function() {
                fetch('/logout', { method: 'POST' })
                    .then(() => {
                        window.location.href = '/html/log.html';
                    })
                    .catch(error => console.error('Logout error:', error));
            });

            fetchComplaints(); 
        });
        function openReviewModal(productId) {
    document.getElementById('review-modal').style.display = 'block';
    document.getElementById('review-form').setAttribute('data-product-id', productId);
}
document.getElementById('recharge-form').addEventListener('submit', function(event) {
    event.preventDefault();
    const formData = new FormData(event.target);
    const data = {};
    formData.forEach((value, key) => {
        data[key] = value; 
    });

    // Логирование данных перед отправкой
    console.log('Recharge data:', data);

    fetch('/recharge', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json'
        },
        body: JSON.stringify(data)
    })
    .then(response => {
        if (response.ok) {
            alert('Баланс пополнен успешно');
            location.reload(); // Перезагрузить страницу для обновления данных
        } else {
            alert('Ошибка при пополнении баланса');
        }
    })
    .catch(error => console.error('Error updating balance:', error));
});
document.getElementById('review-form').addEventListener('submit', function(event) {
    event.preventDefault();
    const formData = new FormData(event.target);
    const data = {};
    formData.forEach((value, key) => {
        data[key] = value;
    });

    // Получаем ID продукта из атрибута формы
    const productId = this.getAttribute('data-product-id');
    data.product_id = productId; // Добавляем ID продукта

    fetch('/submit-review', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json'
        },
        body: JSON.stringify(data)
    })
    .then(response => {
        if (response.ok) {
            alert('Отзыв отправлен');
            document.getElementById('review-modal').style.display = 'none';
            event.target.reset(); // Сброс формы
        } else {
            alert('Ошибка при отправке отзыва');
        }
    })
    .catch(error => console.error('Error submitting review:', error));
});


async function fetchComplaints() {
        const response = await fetch('/support/complaints');
        const complaints = await response.json();
        const complaintsList = document.getElementById('complaints-list');
        complaintsList.innerHTML = '';

        complaints.forEach(complaint => {
            complaintsList.innerHTML += `
                <div>
                    <strong>Тема:</strong> ${complaint.subject}<br>
                    <strong>Причина:</strong> ${complaint.reason}<br>
                    <strong>Почта:</strong> ${complaint.email}<br>
                    <strong>Статус: в обработке</strong><br>
                    <br>
                </div>
            `;
        });
    }
    
    </script>
</body>
</html>
