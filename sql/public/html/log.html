<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Авторизация</title>
    <link rel="stylesheet" href="../css/log.css">
</head>
<body>
    <form action="/login" method="POST">
        <div class="wrapper">
            <h1>Авторизация</h1>
            <div class="input-box">
                <input type="text" name="email" placeholder="Логин" required>
            </div>
            <div class="input-box">
                <input type="password" name="password" placeholder="Пароль" required>
            </div>
            <button type="submit" class="btn">Авторизация</button>
            <div class="register-link">
                <p>Желаете создать аккаунт? <a href="reg.html">Регистрация</a></p>
            </div>
        </div>
    </form>

    <script>
        fetch('/check-session')
            .then(response => response.json())
            .then(data => {
                if (data.isLoggedIn) {
                    window.location.href = 'lk.html';
                }
            })
            .catch(error => console.error('Ошибка проверки сессии:', error));
    </script>
</body>
</html>
